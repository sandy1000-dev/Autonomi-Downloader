[package]
name = "cli"
version = "0.1.0"
edition = "2021"
description = "Native reference tool: generate Autonomi self-encrypted test fixtures using the pristine (unmodified) self_encryption crate"

[[bin]]
name = "gen"
path = "src/gen.rs"

[dependencies]
# Pristine, unmodified upstream self_encryption (reference implementation)
self_encryption = { path = "../../self_encryption" }
rmp-serde = "1"
bytes = "1"
hex = "0.4"
xor_name = "5"
sha2 = "0.10"
rand = "0.8"
anyhow = "1"
