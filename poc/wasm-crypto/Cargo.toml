[package]
name = "wasm-crypto"
version = "0.1.0"
edition = "2021"
description = "Browser (wasm32-unknown-unknown) bindings for Autonomi self-encryption decryption — POC"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
self_encryption = { path = "../vendor/self_encryption" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
hex = "0.4"
bytes = "1"
xor_name = "5"

[dev-dependencies]
sha2 = "0.10"

